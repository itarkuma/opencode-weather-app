name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (tests + typecheck)
        run: bun run check

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "No version field in package.json" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} Tag: v${VERSION}"

      - name: Skip if tag already exists
        id: tag_exists
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries (Linux / macOS / Windows)
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --target=bun-linux-x64 --outfile ./dist/weather-linux-x64
          bun build ./src/index.ts --compile --target=bun-darwin-arm64 --outfile ./dist/weather-macos-arm64
          bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile ./dist/weather-windows-x64.exe
          chmod +x ./dist/weather-linux-x64 ./dist/weather-macos-arm64 || true
          ls -lh dist/

      - name: Create GitHub Release
        if: steps.tag_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/weather-linux-x64
            dist/weather-macos-arm64
            dist/weather-windows-x64.exe
